<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infoscreen - Dashboard</title>
    <link rel="stylesheet" href="stylesheets/dashboard.css?v=4">
</head>
<body>
    <div class="sidebar">
        <a href="#steckbriefe" class="active">Steckbriefe</a>
        <a href="#mitteilungen">Mitteilungen & Termine</a>
        <a href="#filemanager">File Manager</a>
        <a href="#einstellungen">Einstellungen</a>
        <form action="/logout" method="POST" class="logout-form">
            <button type="submit">Logout</button>
        </form>
    </div>

    <main class="content">
        <section id="steckbriefe" class="tab-panel">
            <h1>Steckbriefe</h1>

            <input type="file" id="steckbrief-input" accept=".pptx" hidden>
            <button id="upload-btn">Upload</button>

            <table id="steckbrief-table">
                <thead>
                    <tr><th>Name</th><th></th></tr>
                </thead>
                <tbody id="steckbrief-tbody"></tbody>
            </table>
        </section>

        <section id="mitteilungen" class="tab-panel" hidden>
            <h1>Mitteilungen & Termine</h1>

            <form id="mitteilung-form">
                <input type="text" id="mitteilung-titel" placeholder="Titel" required>
                <textarea id="mitteilung-text" placeholder="Text" required></textarea>
                <input type="date" id="mitteilung-datum">
                <div class="form-aktionen">
                    <button type="submit" id="mitteilung-submit">Hinzufügen</button>
                    <button type="button" id="mitteilung-abbrechen" hidden>Abbrechen</button>
                </div>
            </form>

            <table id="mitteilung-table">
                <thead>
                    <tr><th>Titel</th><th>Datum</th><th></th></tr>
                </thead>
                <tbody id="mitteilung-tbody"></tbody>
            </table>
        </section>

        <section id="filemanager" class="tab-panel" hidden>
            <h1>File Manager</h1>

            <div id="file-breadcrumb"></div>

            <input type="file" id="file-input" hidden>
            <button id="file-upload-btn">Upload</button>

            <table id="file-table">
                <thead>
                    <tr><th>Name</th><th>Typ</th><th>Größe</th><th></th></tr>
                </thead>
                <tbody id="file-tbody"></tbody>
            </table>
        </section>

        <section id="einstellungen" class="tab-panel" hidden>
            <h1>Einstellungen</h1>

            <form id="einstellungen-form">
                <label for="effekt">Übergangseffekt</label>
                <select id="effekt">
                    <option value="fade">Überblenden</option>
                    <option value="slide">Schieben</option>
                    <option value="zoom">Zoom</option>
                    <option value="flip">Drehen</option>
                    <option value="keiner">Kein Effekt</option>
                </select>

                <label for="anzeigedauer">Anzeigedauer pro Seite (Sekunden)</label>
                <input type="number" id="anzeigedauer" min="2" max="300" step="1">

                <label for="effektdauer">Dauer des Übergangs (Sekunden)</label>
                <input type="number" id="effektdauer" min="0" max="5" step="0.1">

                <div class="form-aktionen">
                    <button type="submit">Speichern</button>
                    <span id="einstellungen-status"></span>
                </div>
            </form>
        </section>
    </main>

    <script src="scripts/dashboard.js?v=4"></script>
</body>
</html>
