<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infoscreen - Login</title>
    <style>
        @import url(https://db.onlinewebfonts.com/c/8aeae1821b3b4eb7b61b0e7122951c69?family=VWAG+TheSans);

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #C6DFE7;
            font-family: 'VWAG TheSans', sans-serif;
        }

        form {
            background-color: #ffffff;
            padding: 2rem 2.5rem;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
            gap: 1rem;
            width: 260px;
        }

        h1 {
            font-size: 1.2rem;
            color: #001E50;
            margin: 0 0 0.5rem 0;
        }

        input {
            padding: 0.6rem;
            border: 1px solid #A8ADB3;
            border-radius: 4px;
            font-family: inherit;
        }

        button {
            padding: 0.6rem;
            border: none;
            border-radius: 4px;
            background-color: #001E50;
            color: #ffffff;
            cursor: pointer;
        }

        button:hover {
            background-color: #00B0F0;
        }

        button:disabled {
            opacity: 0.65;
            cursor: wait;
        }

        .error {
            color: #b00020;
            font-size: 0.85rem;
            margin: 0;
        }
    </style>
</head>
<body>
    <form id="login" action="/login" method="POST">
        <h1>Infoscreen Dashboard</h1>
        <input id="password" type="password" name="password" placeholder="Team-Passwort" aria-label="Team-Passwort" autocomplete="current-password" required>
        <button type="submit">Einloggen</button>
        <p class="error" id="error" role="alert" hidden>Falsches Passwort.</p>
    </form>
    <script>
        (() => {
            const form = document.getElementById('login');
            const password = document.getElementById('password');
            const button = form.querySelector('button');
            const error = document.getElementById('error');
            let busy = false;

            function setBusy(value) {
                busy = value;
                button.disabled = value;
                button.textContent = value ? 'Anmeldung läuft …' : 'Einloggen';
                form.setAttribute('aria-busy', String(value));
            }

            function showError(message) {
                error.textContent = message;
                error.hidden = false;
            }

            async function request(url, options = {}) {
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), 15000);
                try {
                    const response = await fetch(url, {
                        ...options,
                        credentials: 'same-origin',
                        cache: 'no-store',
                        redirect: 'error',
                        signal: controller.signal,
                        headers: { ...options.headers, Accept: 'application/json' }
                    });
                    const data = await response.json();
                    return { response, data };
                } finally {
                    clearTimeout(timeout);
                }
            }

            async function sessionExists() {
                const { response, data } = await request('/api/session');
                if (response.status === 401) return false;
                if (!response.ok || data.authenticated !== true) throw new Error('Sitzung konnte nicht geprüft werden. Bitte erneut versuchen.');
                return true;
            }

            form.addEventListener('submit', async event => {
                // Stop native form navigation before Safari opens its save dialog.
                event.preventDefault();
                if (busy) return;
                setBusy(true);
                error.hidden = true;
                try {
                    const { response, data } = await request('/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ password: password.value })
                    });
                    if (!response.ok || data.ok !== true) throw new Error(data.error || 'Anmeldung fehlgeschlagen. Bitte erneut versuchen.');
                    // A successful POST alone does not prove the browser kept
                    // the cookie. Do not navigate into a login loop without it.
                    if (!await sessionExists()) throw new Error('Die Anmeldung konnte nicht gespeichert werden. Bitte Cookies für diese Seite erlauben und erneut einloggen.');
                    window.location.replace('/dashboard/dashboard.html');
                } catch (err) {
                    showError(err instanceof TypeError || err.name === 'AbortError'
                        ? 'Keine Verbindung zum Server. Bitte erneut versuchen.' : err.message);
                } finally {
                    setBusy(false);
                }
            });

            // A restored page may bypass GET /login.html and still show an old
            // form even though the previous request already logged the user in.
            window.addEventListener('pageshow', async event => {
                if (!event.persisted || busy) return;
                setBusy(true);
                try {
                    if (await sessionExists()) window.location.replace('/dashboard/dashboard.html');
                } catch (err) {
                    showError('Sitzung konnte nicht geprüft werden. Bitte erneut einloggen.');
                } finally {
                    setBusy(false);
                }
            });

            if (new URLSearchParams(window.location.search).get('error')) showError('Falsches Passwort.');
        })();
    </script>
</body>
</html>
